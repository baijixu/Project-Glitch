[project]
name = "glitch-brain"
version = "0.1.0"
description = "Glitch's Brain -- owns the conversation loop, hosts the WebSocket server the Renderer connects to (spec section 5)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "websockets>=13.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "torch>=2.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    # Glitch's own native memory (brain/memory.py) -- the same semantic
    # memory service Hermes itself uses, via its official client.
    "hindsight-client>=0.6.1",
]
