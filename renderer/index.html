<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glitch</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="status"></div>
    <div id="subtitle"></div>
    <button id="history-button" class="corner-button" title="Chat history">🌸</button>
    <aside id="history-panel" class="slide-panel">
      <h2>Chat History</h2>
      <div id="history-list"></div>
    </aside>
    <button id="settings-button" class="corner-button" title="Settings">⚙️</button>
    <aside id="settings-panel" class="slide-panel">
      <h2>Settings</h2>
      <div id="settings-content">More controls coming soon.</div>
    </aside>
    <div id="chat-bar">
      <input id="message-input" type="text" placeholder="Type a message to Glitch..." autocomplete="off" />
      <button id="send-button">Send</button>
      <button id="mic-button" title="Hold to talk">
        <span class="mic-icon">🎤</span><span id="mic-label" class="mic-label"> Hold to talk</span>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
