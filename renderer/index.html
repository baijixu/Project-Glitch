<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glitch</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="status"></div>
    <div id="subtitle"></div>
    <button id="history-button" class="corner-button" title="Chat history">🌸</button>
    <aside id="history-panel" class="slide-panel">
      <h2>Chat History</h2>
      <div id="history-list"></div>
    </aside>
    <button id="settings-button" class="corner-button" title="Settings">⚙️</button>
    <aside id="settings-panel" class="slide-panel">
      <h2>Settings</h2>
      <div id="settings-content">
        <section class="settings-section">
          <h3>User Profile</h3>
          <p class="settings-hint">Pick a saved profile to role-play with Glitch, or create a new one.</p>
          <div id="profile-list"></div>
          <button id="new-profile-button" class="settings-action-button">New Profile</button>
        </section>
      </div>
    </aside>

    <div id="profile-modal-backdrop" class="modal-backdrop" hidden>
      <div id="profile-modal" class="modal" role="dialog" aria-labelledby="profile-modal-title">
        <h2 id="profile-modal-title">New Profile</h2>
        <label for="profile-name">Profile name</label>
        <input id="profile-name" type="text" placeholder="e.g. Brave Knight" autocomplete="off" />
        <label for="profile-content">Character &amp; scenario</label>
        <textarea
          id="profile-content"
          rows="8"
          placeholder="Describe who you're playing as and the scenario you want to play out..."
        ></textarea>
        <div class="modal-actions">
          <button id="profile-cancel-button" class="modal-button secondary">Cancel</button>
          <button id="profile-save-button" class="modal-button primary">Save</button>
        </div>
      </div>
    </div>
    <div id="chat-bar">
      <input id="message-input" type="text" placeholder="Type a message to Glitch..." autocomplete="off" />
      <button id="send-button">Send</button>
      <button id="mic-button" title="Hold to talk">
        <span class="mic-icon">🎤</span><span id="mic-label" class="mic-label"> Hold to talk</span>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
